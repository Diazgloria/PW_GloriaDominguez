<!DOCTYPE html>

<!-- Ejercicio 9.20 puntos_calidad.html
Devuelve los puntos de calidad según el promedio del estudiante -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 9.20</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f8;
                color: #333;
                text-align: center;
                margin: 0;
                padding: 40px 20px;
            }
            h1 { color: #2c3e50; }
            .resultado {
                background-color: #fff;
                border-left: 5px solid #2980b9;
                max-width: 450px;
                margin: 15px auto;
                padding: 10px 20px;
                font-size: 1.1em;
            }
            footer { margin-top: 40px; }
            a { color: #2980b9; text-decoration: none; }
            a:hover { text-decoration: underline; }
        </style>
        <script>
            // devuelve 4, 3, 2, 1 o 0 según el promedio
            function puntosCalidad(promedio)
            {
                if (promedio >= 90)
                    return 4;
                if (promedio >= 80)
                    return 3;
                if (promedio >= 70)
                    return 2;
                if (promedio >= 60)
                    return 1;
                return 0;  // menor a 60
            } // fin de la función puntosCalidad

            var promedio = parseFloat(window.prompt("Escriba el promedio del estudiante (0 a 100)"));

            // repite mientras el promedio no sea válido
            while (isNaN(promedio) || promedio < 0 || promedio > 100)
            {
                window.alert("El promedio debe ser un número entre 0 y 100.");
                promedio = parseFloat(window.prompt("Escriba el promedio del estudiante (0 a 100)"));
            } // fin del while

            document.writeln("<h1>Puntos de calidad</h1>");
            document.writeln("<div class='resultado'>");
            document.writeln("<p>Promedio: " + promedio + "</p>");
            document.writeln("<p>Puntos de calidad: <strong>" + puntosCalidad(promedio) + "</strong></p>");
            document.writeln("</div>");
        </script>
    </head>
    <body>
        <footer>
            <hr>
            <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>
        </footer>
    </body>
</html>

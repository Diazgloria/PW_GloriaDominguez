<!DOCTYPE html>

<!-- Ejercicio 9.11 rangos_aleatorios.html
Asigna enteros aleatorios a n en distintos rangos -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 9.11</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f8;
                color: #333;
                text-align: center;
                margin: 0;
                padding: 40px 20px;
            }
            h1 { color: #2c3e50; }
            table {
                margin: 20px auto;
                border-collapse: collapse;
                background-color: #fff;
            }
            th, td {
                border: 2px solid #2c3e50;
                padding: 6px 20px;
                text-align: center;
            }
            th { background-color: #dfe6ec; color: #2c3e50; }
            code { text-align: left; }
            footer { margin-top: 40px; }
            a { color: #2980b9; text-decoration: none; }
            a:hover { text-decoration: underline; }
        </style>
        <script>
            var n;

            document.writeln("<h1>Enteros aleatorios por rango</h1>");
            document.writeln("<table>");
            document.writeln("<tr><th>Inciso</th><th>Rango</th><th>Instrucción</th><th>n</th></tr>");

            // a) 1 <= n <= 2
            n = Math.floor(Math.random() * 2) + 1;
            document.writeln("<tr><td>a)</td><td>1 &le; n &le; 2</td>" +
                "<td><code>n = Math.floor(Math.random() * 2) + 1;</code></td><td>" + n + "</td></tr>");

            // b) 1 <= n <= 100
            n = Math.floor(Math.random() * 100) + 1;
            document.writeln("<tr><td>b)</td><td>1 &le; n &le; 100</td>" +
                "<td><code>n = Math.floor(Math.random() * 100) + 1;</code></td><td>" + n + "</td></tr>");

            // c) 0 <= n <= 9
            n = Math.floor(Math.random() * 10);
            document.writeln("<tr><td>c)</td><td>0 &le; n &le; 9</td>" +
                "<td><code>n = Math.floor(Math.random() * 10);</code></td><td>" + n + "</td></tr>");

            // d) 1000 <= n <= 1112 (113 valores)
            n = Math.floor(Math.random() * 113) + 1000;
            document.writeln("<tr><td>d)</td><td>1000 &le; n &le; 1112</td>" +
                "<td><code>n = Math.floor(Math.random() * 113) + 1000;</code></td><td>" + n + "</td></tr>");

            // e) -1 <= n <= 1 (3 valores)
            n = Math.floor(Math.random() * 3) - 1;
            document.writeln("<tr><td>e)</td><td>-1 &le; n &le; 1</td>" +
                "<td><code>n = Math.floor(Math.random() * 3) - 1;</code></td><td>" + n + "</td></tr>");

            // f) -3 <= n <= 11 (15 valores)
            n = Math.floor(Math.random() * 15) - 3;
            document.writeln("<tr><td>f)</td><td>-3 &le; n &le; 11</td>" +
                "<td><code>n = Math.floor(Math.random() * 15) - 3;</code></td><td>" + n + "</td></tr>");

            document.writeln("</table>");
            document.writeln("<p>Recarga la página para obtener otros valores.</p>");
        </script>
    </head>
    <body>
        <footer>
            <hr>
            <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>
        </footer>
    </body>
</html>

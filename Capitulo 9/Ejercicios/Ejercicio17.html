<!DOCTYPE html>

<!-- Ejercicio 9.17 temperatura.html
Conversión entre grados Celsius y Fahrenheit -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 9.17</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f8;
                color: #333;
                text-align: center;
                margin: 0;
                padding: 40px 20px;
            }
            h1 { color: #2c3e50; }
            form {
                background-color: #fff;
                border-left: 5px solid #2980b9;
                max-width: 420px;
                margin: 20px auto;
                padding: 20px;
            }
            input[type=text] { padding: 5px; width: 100px; text-align: center; }
            input[type=button] {
                padding: 6px 14px;
                margin: 4px;
                background-color: #2980b9;
                color: #fff;
                border: none;
                cursor: pointer;
            }
            #resultado { font-size: 1.2em; font-weight: bold; color: #2c3e50; }
            footer { margin-top: 40px; }
            a { color: #2980b9; text-decoration: none; }
            a:hover { text-decoration: underline; }
        </style>
        <script>
            // a) devuelve el equivalente en Celsius de una temperatura Fahrenheit
            function celsius(f)
            {
                return 5.0 / 9.0 * (f - 32);
            } // fin de la función celsius

            // b) devuelve el equivalente en Fahrenheit de una temperatura Celsius
            function fahrenheit(c)
            {
                return 9.0 / 5.0 * c + 32;
            } // fin de la función fahrenheit

            // c) funciones llamadas por los dos botones
            function deFaC()
            {
                var f = parseFloat(document.getElementById("temperatura").value);

                if (isNaN(f))
                    document.getElementById("resultado").innerHTML = "Escriba una temperatura válida.";
                else
                    document.getElementById("resultado").innerHTML =
                        f + " °F = " + celsius(f).toFixed(2) + " °C";
            } // fin de la función deFaC

            function deCaF()
            {
                var c = parseFloat(document.getElementById("temperatura").value);

                if (isNaN(c))
                    document.getElementById("resultado").innerHTML = "Escriba una temperatura válida.";
                else
                    document.getElementById("resultado").innerHTML =
                        c + " °C = " + fahrenheit(c).toFixed(2) + " °F";
            } // fin de la función deCaF
        </script>
    </head>
    <body>
        <h1>Conversión de temperatura</h1>
        <form action="#">
            <p>Temperatura: <input id="temperatura" type="text"></p>
            <p>
                <input type="button" value="Fahrenheit a Celsius" onclick="deFaC()">
                <input type="button" value="Celsius a Fahrenheit" onclick="deCaF()">
            </p>
        </form>
        <p id="resultado"></p>
        <footer>
            <hr>
            <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>
        </footer>
    </body>
</html>

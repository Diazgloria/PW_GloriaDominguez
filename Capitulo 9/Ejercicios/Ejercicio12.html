<!DOCTYPE html>

<!-- Ejercicio 9.12 conjuntos_aleatorios.html
Imprime un número al azar de cada conjunto con una sola instrucción -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 9.12</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f8;
                color: #333;
                text-align: center;
                margin: 0;
                padding: 40px 20px;
            }
            h1 { color: #2c3e50; }
            p {
                font-size: 1.1em;
                background-color: #fff;
                border-left: 5px solid #2980b9;
                max-width: 450px;
                margin: 10px auto;
                padding: 8px 20px;
            }
            footer { margin-top: 40px; }
            a { color: #2980b9; text-decoration: none; }
            a:hover { text-decoration: underline; }
        </style>
        <script>
            document.writeln("<h1>Número al azar de un conjunto</h1>");

            // a) 2, 4, 6, 8, 10
            document.writeln("<p>a) {2, 4, 6, 8, 10}: " +
                (2 + 2 * Math.floor(Math.random() * 5)) + "</p>");

            // b) 3, 5, 7, 9, 11
            document.writeln("<p>b) {3, 5, 7, 9, 11}: " +
                (3 + 2 * Math.floor(Math.random() * 5)) + "</p>");

            // c) 6, 10, 14, 18, 22
            document.writeln("<p>c) {6, 10, 14, 18, 22}: " +
                (6 + 4 * Math.floor(Math.random() * 5)) + "</p>");
        </script>
    </head>
    <body>
        <footer>
            <hr>
            <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>
        </footer>
    </body>
</html>

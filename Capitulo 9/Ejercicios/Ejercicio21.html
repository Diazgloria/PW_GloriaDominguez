<!DOCTYPE html>

<!-- Ejercicio 9.21 moneda.html
Simula el lanzamiento de una moneda y cuenta cada lado -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 9.21</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f8;
                color: #333;
                text-align: center;
                margin: 0;
                padding: 40px 20px;
            }
            h1 { color: #2c3e50; }
            input[type=button] {
                padding: 10px 24px;
                font-size: 1.1em;
                background-color: #2980b9;
                color: #fff;
                border: none;
                cursor: pointer;
            }
            #ultimo { font-size: 1.6em; font-weight: bold; color: #2c3e50; margin: 25px; }
            table {
                margin: 20px auto;
                border-collapse: collapse;
                background-color: #fff;
            }
            th, td {
                border: 2px solid #2c3e50;
                padding: 6px 25px;
                text-align: center;
            }
            th { background-color: #dfe6ec; color: #2c3e50; }
            footer { margin-top: 40px; }
            a { color: #2980b9; text-decoration: none; }
            a:hover { text-decoration: underline; }
        </style>
        <script>
            var caras = 0;   // veces que salió cara
            var cruces = 0;  // veces que salió cruz

            // devuelve true para cara y false para cruz
            function arrojar()
            {
                return Math.floor(Math.random() * 2) == 1;
            } // fin de la función arrojar

            // se llama al hacer clic en el botón Lanzar
            function lanzar()
            {
                var total;

                if (arrojar())
                {
                    ++caras;
                    document.getElementById("ultimo").innerHTML = "Cara";
                }
                else
                {
                    ++cruces;
                    document.getElementById("ultimo").innerHTML = "Cruz";
                }

                total = caras + cruces;

                document.getElementById("caras").innerHTML = caras;
                document.getElementById("cruces").innerHTML = cruces;
                document.getElementById("pCaras").innerHTML = (caras / total * 100).toFixed(1) + "%";
                document.getElementById("pCruces").innerHTML = (cruces / total * 100).toFixed(1) + "%";
                document.getElementById("total").innerHTML = total;
            } // fin de la función lanzar
        </script>
    </head>
    <body>
        <h1>Lanzamiento de moneda</h1>
        <p><input type="button" value="Lanzar" onclick="lanzar()"></p>
        <p id="ultimo">&nbsp;</p>
        <table>
            <tr><th>Lado</th><th>Veces</th><th>Porcentaje</th></tr>
            <tr><td>Cara</td><td id="caras">0</td><td id="pCaras">0%</td></tr>
            <tr><td>Cruz</td><td id="cruces">0</td><td id="pCruces">0%</td></tr>
            <tr><td><strong>Total</strong></td><td id="total">0</td><td>100%</td></tr>
        </table>
        <footer>
            <hr>
            <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>
        </footer>
    </body>
</html>

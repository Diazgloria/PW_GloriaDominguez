<!DOCTYPE html>

<!-- Ejercicio 9.27 aritmetica.html
Instrucción asistida por computadora con nivel de grado y tipo de problema -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 9.27</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f8;
                color: #333;
                text-align: center;
                margin: 0;
                padding: 40px 20px;
            }
            h1 { color: #2c3e50; }
            form {
                background-color: #fff;
                border-left: 5px solid #2980b9;
                max-width: 420px;
                margin: 20px auto;
                padding: 20px;
            }
            select { padding: 5px; font-size: 1em; }
            #pregunta { font-size: 1.5em; font-weight: bold; color: #2c3e50; }
            input[type=text] { padding: 6px; width: 110px; text-align: center; font-size: 1.1em; }
            input[type=submit] {
                padding: 7px 16px;
                background-color: #2980b9;
                color: #fff;
                border: none;
                cursor: pointer;
            }
            #mensaje { font-size: 1.3em; font-weight: bold; }
            .bien { color: #27ae60; }
            .mal { color: #c0392b; }
            #evaluacion {
                background-color: #fff;
                border-left: 5px solid #e67e22;
                max-width: 450px;
                margin: 20px auto;
                padding: 10px 20px;
                font-weight: bold;
            }
            footer { margin-top: 40px; }
            a { color: #2980b9; text-decoration: none; }
            a:hover { text-decoration: underline; }
        </style>
        <script>
            var respuestaCorrecta;  // resultado de la pregunta actual
            var correctas = 0;
            var incorrectas = 0;

            function mensajeCorrecto()
            {
                var mensaje;

                switch (Math.floor(Math.random() * 4) + 1)
                {
                    case 1: mensaje = "¡Muy bien!"; break;
                    case 2: mensaje = "Excelente."; break;
                    case 3: mensaje = "Buen trabajo."; break;
                    case 4: mensaje = "Siga así."; break;
                }

                return mensaje;
            } // fin de la función mensajeCorrecto

            function mensajeIncorrecto()
            {
                var mensaje;

                switch (Math.floor(Math.random() * 4) + 1)
                {
                    case 1: mensaje = "No. Intente de nuevo."; break;
                    case 2: mensaje = "Equivocado. Trate una vez más."; break;
                    case 3: mensaje = "No se dé por vencido."; break;
                    case 4: mensaje = "No. Siga intentando."; break;
                }

                return mensaje;
            } // fin de la función mensajeIncorrecto

            // entero aleatorio de 1 a (10^nivel - 1): nivel 1 = un dígito, 2 = hasta dos...
            function numeroAleatorio(nivel)
            {
                var maximo = Math.pow(10, nivel) - 1;
                return Math.floor(Math.random() * maximo) + 1;
            } // fin de la función numeroAleatorio

            function nuevaPregunta()
            {
                var nivel = parseInt(document.getElementById("nivel").value);
                var tipo = parseInt(document.getElementById("tipo").value);
                var a = numeroAleatorio(nivel);
                var b = numeroAleatorio(nivel);
                var temporal, texto;

                // opción 5: elige al azar entre los cuatro tipos
                if (tipo == 5)
                    tipo = Math.floor(Math.random() * 4) + 1;

                switch (tipo)
                {
                    case 1:  // suma
                        texto = a + " más " + b;
                        respuestaCorrecta = a + b;
                        break;
                    case 2:  // resta (el mayor va primero para no obtener negativos)
                        if (a < b)
                        {
                            temporal = a;
                            a = b;
                            b = temporal;
                        }
                        texto = a + " menos " + b;
                        respuestaCorrecta = a - b;
                        break;
                    case 3:  // multiplicación
                        texto = a + " por " + b;
                        respuestaCorrecta = a * b;
                        break;
                    case 4:  // división exacta: (a * b) entre a da b
                        texto = (a * b) + " entre " + a;
                        respuestaCorrecta = b;
                        break;
                } // fin del switch

                document.getElementById("pregunta").innerHTML = "¿Cuánto es " + texto + "?";
                document.getElementById("respuesta").value = "";
                document.getElementById("respuesta").focus();
            } // fin de la función nuevaPregunta

            function actualizarContador()
            {
                document.getElementById("contador").innerHTML =
                    "Respuestas: " + (correctas + incorrectas) + " de 10 | " +
                    "Correctas: " + correctas + " | Incorrectas: " + incorrectas;
            } // fin de la función actualizarContador

            // al cambiar el nivel o el tipo se reinicia el cuestionario
            function cambiarConfiguracion()
            {
                correctas = 0;
                incorrectas = 0;
                actualizarContador();
                nuevaPregunta();
            } // fin de la función cambiarConfiguracion

            function evaluar()
            {
                var total = correctas + incorrectas;
                var porcentaje = correctas / total * 100;
                var texto = "Resultado: " + correctas + " de " + total +
                    " correctas (" + porcentaje.toFixed(0) + "%). ";

                if (porcentaje < 75)
                    texto += "Pida ayuda adicional a su instructor.";
                else
                    texto += "¡Buen desempeño!";

                document.getElementById("evaluacion").innerHTML = texto;
                document.getElementById("evaluacion").style.display = "block";

                correctas = 0;
                incorrectas = 0;
            } // fin de la función evaluar

            function verificar()
            {
                var respuesta = parseInt(document.getElementById("respuesta").value);
                var mensaje = document.getElementById("mensaje");
                var acerto;

                if (isNaN(respuesta))
                {
                    mensaje.className = "mal";
                    mensaje.innerHTML = "Escriba un número entero.";
                    return;
                }

                acerto = (respuesta == respuestaCorrecta);

                if (acerto)
                {
                    ++correctas;
                    mensaje.className = "bien";
                    mensaje.innerHTML = mensajeCorrecto();
                }
                else
                {
                    ++incorrectas;
                    mensaje.className = "mal";
                    mensaje.innerHTML = mensajeIncorrecto();
                }

                if (correctas + incorrectas == 10)
                {
                    evaluar();
                    nuevaPregunta();
                }
                else if (acerto)
                    nuevaPregunta();
                else
                {
                    document.getElementById("respuesta").value = "";
                    document.getElementById("respuesta").focus();
                }

                actualizarContador();
            } // fin de la función verificar
        </script>
    </head>
    <body>
        <h1>Práctica de aritmética</h1>
        <form action="#" onsubmit="verificar(); return false;">
            <p>
                Nivel de grado:
                <select id="nivel" onchange="cambiarConfiguracion()">
                    <option value="1">1 (un dígito)</option>
                    <option value="2">2 (hasta dos dígitos)</option>
                    <option value="3">3 (hasta tres dígitos)</option>
                    <option value="4">4 (hasta cuatro dígitos)</option>
                    <option value="5">5 (hasta cinco dígitos)</option>
                </select>
            </p>
            <p>
                Tipo de problema:
                <select id="tipo" onchange="cambiarConfiguracion()">
                    <option value="1">1 - Suma</option>
                    <option value="2">2 - Resta</option>
                    <option value="3" selected>3 - Multiplicación</option>
                    <option value="4">4 - División</option>
                    <option value="5">5 - Mezcla al azar</option>
                </select>
            </p>
            <hr>
            <p id="pregunta"></p>
            <p>
                <input id="respuesta" type="text" autocomplete="off">
                <input type="submit" value="Responder">
            </p>
        </form>
        <p id="mensaje">&nbsp;</p>
        <p id="contador">Respuestas: 0 de 10 | Correctas: 0 | Incorrectas: 0</p>
        <p id="evaluacion" style="display:none"></p>
        <footer>
            <hr>
            <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>
        </footer>
        <script>
            nuevaPregunta();
        </script>
    </body>
</html>

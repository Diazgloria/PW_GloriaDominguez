<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5.11</title>
    <style type="text/css">
        .contenedor {
            position: relative;
            width: 300px;
            height: 200px;
        }
        .contenedor img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition-duration: 3s;
            transition-timing-function: linear;
            opacity: 0;
        }
        .contenedor img:first-child {
            opacity: 1;
        }
        .contenedor:hover img {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <img src="../Ejercicios/Imagenes/img1.png" alt="Imagen 1">
        <img src="../Ejercicios/Imagenes/img2.png" alt="Imagen 2">
        <img src="../Ejercicios/Imagenes/img3.png" alt="Imagen 3">
        <img src="../Ejercicios/Imagenes/img4.png" alt="Imagen 4">
        <img src="../Ejercicios/Imagenes/img5.png" alt="Imagen 5">
    </div>
    <hr>
    <a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a>
</body>
</html>

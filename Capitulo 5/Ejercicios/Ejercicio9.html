<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5.9</title>
    <style type="text/css">
        div {
            width: 50px;
            height: 50px;
            background-color: red;
            position: relative;
            animation: cuadrado 4s infinite;
        }

        @keyframes cuadrado {
            0%   { top: 0px; left: 0px; }
            25%  { top: 0px; left: 100px; }
            50%  { top: 100px; left: 100px; }
            75%  { top: 100px; left: 0px; }
            100% { top: 0px; left: 0px; }
        }
    </style>
</head>
<body>
    <div></div>
    <hr>
    <a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a>
</body>
</html>

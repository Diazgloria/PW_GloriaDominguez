<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5.16</title>
    <style type="text/css">
        .contenido {
            column-count: 3;
        }
        /* Ajuste para dispositivos móviles (máximo 480px) */
        @media (max-width: 480px) {
            .contenido {
                column-count: 1;
            }
        }
    </style>
</head>
<body>
    <div class="contenido">
        <p>Columna de texto 1. En pantallas grandes se muestra en 3 columnas.</p>
        <p>Columna de texto 2. Al reducir la pantalla a menos de 480px se pasa a 1 sola columna.</p>
        <p>Columna de texto 3. Ideal para adaptarse a dispositivos móviles.</p>
    </div>
    <hr>
    <a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a>
</body>
</html>

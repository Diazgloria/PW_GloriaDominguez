<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5.5</title>
    <style type="text/css">
        div {
            width: 100px;
            height: 100px;
            border: 3px solid black;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .caja1 {
            border-radius: 10px;
            background-color: lightcoral;
        }
        .caja2 {
            border-radius: 50px;
            background-color: lightgreen;
        }
        .caja3 {
            border-radius: 100px;
            background-color: lightskyblue;
        }
    </style>
</head>
<body>
    <div class="caja1"><b>10px</b></div>
    <div class="caja2"><b>50px</b></div>
    <div class="caja3"><b>100px</b></div>
    <hr>
    <a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a>
</body>
</html>

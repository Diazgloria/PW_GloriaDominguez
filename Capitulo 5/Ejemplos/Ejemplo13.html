<!DOCTYPE html>

<!--figura 5.14 fisuonarimagenes.html
fusionar una imagen en otra mediante CSS3-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Fusion de imagenes</title>
        <style type="text/css">
            #portada
            {
                position: relative;
                margin: 0 auto;
            }
            #portada img
            {
                position: absolute;
                left: 0;
                -webkit-transition: opacity 4s ease-in-out;
                transition: opacity 4s ease-in-out;
            }
            #portada img.top:hover
            {opacity: 0;}
        </style>
    </head>
    <body>
        <div id="portada">
            <img class="bottom" src="../Ejemplos/Imagenes/jhtp.png" alt="Portada de Java 9e">
            <img class="top" src="../Ejemplos/Imagenes/jhtp8.png" alt="Portada de java 8e">
        </div>
    </body>
</html>

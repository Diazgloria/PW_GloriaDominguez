<!DOCTYPE html>

<!--figura 5.12 transiciones.html
transiciones en CSS3-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Transiciones</title>
        <style type="text/css">
            img
            {
                margin: 80px;
                -webkit-transition: -webkit-transform;
                -moz-transition: -moz-transform;
                -o-transition: -o-transform;
                transition: transform 4s;
            }
            img:hover
            {
                -webkit-transform: rotate(360deg) scale(2, 2);
                -moz-transform: rotate(360deg) scale(2, 2);
                -o-transform: rotate(360deg) scale(2, 2);
                transform: rotate(360deg) scale(2, 2);
            }
        </style>
    </head>
    <body>
        <img src="../Ejemplos/Imagenes/cpphtp.png " width="76" height="100"
        alt="Portada del libro C++ How Tp Program">
        
    </body>
</html>

<!DOCTYPE html>

<!--figura 5.2 esquinasredondeadas.html
uso de border-radius para agregar esquinas redondeadas a dos elementos-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Esquinas redondeadas</title>
        <style type="text/css">
            div 
            {
                border: 3px solid navy;
                padding: 5px 20px;
                background: lightcyan;
                width: 200px;
                text-align: center;
                border-radius: 15px;/*agrega esquinas */
                margin-bottom: 20px;
            }
            #redonda2
            {
                border: 3px solid navy;
                padding: 5px 20px;
                background: lightcyan;
                width: 200px;
                text-align: center;
                border-radius: 50px;/*aumenta border radius*/
            }
        </style>
    </head>
    <body>
        <div>La propiedad border-radius agrega esquinas redondeadas
            a un elemento.
        </div>
        <div id="redonda2">Al aumentas el valor de border-radius se redondean
            mas las esquinas del elemento
        </div>

        <footer>
            <hr>
            <p><a href="lista_ejemplos.html">Regresar a la lista de ejemplos</a></p>
        </footer>
    </body>
</html>

<!DOCTYPE html>

<!-- Ejercicio 7.14 sueldos.html
Sueldo bruto de tres empleados con cuota y media después de 40 horas -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 7.14</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f8;
                color: #333;
                text-align: center;
                margin: 0;
                padding: 40px 20px;
            }
            h1 { color: #2c3e50; }
            p { font-size: 1.1em; }
            .empleado {
                background-color: #fff;
                border-left: 5px solid #2980b9;
                max-width: 450px;
                margin: 15px auto;
                padding: 10px 20px;
                text-align: left;
            }
            footer { margin-top: 40px; }
            a { color: #2980b9; text-decoration: none; }
            a:hover { text-decoration: underline; }
        </style>
        <script>
            var empleado = 1;  // contador de empleados
            var horas;         // horas trabajadas
            var tarifa;        // tarifa por hora
            var sueldo;        // sueldo bruto

            document.writeln("<h1>Sueldo bruto de los empleados</h1>");

            // el ciclo se repite para los tres empleados
            while (empleado <= 3)
            {
                horas = parseFloat(window.prompt("Empleado " + empleado + ": horas trabajadas"));
                tarifa = parseFloat(window.prompt("Empleado " + empleado + ": tarifa por hora"));

                // calcula el sueldo bruto
                if (horas <= 40)
                    sueldo = horas * tarifa;
                else
                    sueldo = 40 * tarifa + (horas - 40) * tarifa * 1.5;

                document.writeln("<div class='empleado'>");
                document.writeln("<p><strong>Empleado " + empleado + "</strong></p>");
                document.writeln("<p>Horas: " + horas + " | Tarifa: $" + tarifa.toFixed(2) + "</p>");
                document.writeln("<p>Sueldo bruto: $" + sueldo.toFixed(2) + "</p>");
                document.writeln("</div>");

                ++empleado;  // pasa al siguiente empleado
            } // fin del while
        </script>
    </head>
    <body>
        <footer>
            <hr>
            <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>
        </footer>
    </body>
</html>

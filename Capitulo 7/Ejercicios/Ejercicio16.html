<!DOCTYPE html>

<!-- Ejercicio 7.16 tabla_multiplos.html
Tabla de N, 10*N, 100*N y 1000*N generada con un ciclo while -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 7.16</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f8;
                color: #333;
                margin: 0;
                padding: 40px 20px;
            }
            h1 {
                color: #2c3e50;
                text-align: center;
            }
            table {
                margin: 20px auto;
                border-collapse: collapse;
                background-color: #fff;
            }
            th, td {
                border: 2px solid #2c3e50;
                padding: 6px 20px;
                text-align: center;   /* centra los datos de cada columna */
            }
            th {
                background-color: #dfe6ec;
                color: #2c3e50;
            }
            footer {
                margin-top: 40px;
                text-align: center;
            }
            a { color: #2980b9; text-decoration: none; }
            a:hover { text-decoration: underline; }
        </style>
        <script>
            var n = 1;  // contador del ciclo

            document.writeln("<h1>Tabla de múltiplos</h1>");
            document.writeln("<table>");
            document.writeln("<tr><th>N</th><th>10*N</th><th>100*N</th><th>1000*N</th></tr>");

            // una fila por cada valor de N del 1 al 6
            while (n <= 6)
            {
                document.writeln("<tr>");
                document.writeln("<td>" + n + "</td>");
                document.writeln("<td>" + (10 * n) + "</td>");
                document.writeln("<td>" + (100 * n) + "</td>");
                document.writeln("<td>" + (1000 * n) + "</td>");
                document.writeln("</tr>");

                ++n;
            } // fin del while

            document.writeln("</table>");
        </script>
    </head>
    <body>
        <footer>
            <hr>
            <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>
        </footer>
    </body>
</html>

<!DOCTYPE html>

<!-- Ejercicio 7.4 instrucciones_suma.html
Declaración, asignación, suma e impresión de variables -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 7.4</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f8;
                color: #333;
                text-align: center;
                margin: 0;
                padding: 40px 20px;
            }
            h1 { color: #2c3e50; }
            p { font-size: 1.1em; }
            footer { margin-top: 40px; }
            a { color: #2980b9; text-decoration: none; }
            a:hover { text-decoration: underline; }
        </style>
        <script>
            // a) declara las variables suma y x
            var suma, x;

            // b) asigna 1 a la variable x
            x = 1;

            // c) asigna 0 a la variable suma
            suma = 0;

            // d) suma x a suma y asigna el resultado a suma
            suma += x;

            // e) imprime "La suma es: " seguido del valor de suma
            document.writeln("<h1>Ejercicio 7.4</h1>");
            document.writeln("<p>La suma es: " + suma + "</p>");
        </script>
    </head>
    <body>
        <footer>
            <hr>
            <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>
        </footer>
    </body>
</html>

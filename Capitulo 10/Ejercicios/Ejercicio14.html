<!DOCTYPE html>

<!-- Ejercicio 10.14 - Capítulo 10 -->
<!-- Simulación del tiro de dos dados 36,000 veces -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 10.14 - Simulación de Tiro de Dados</title>
        
        <style type="text/css">
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f9;
                color: #333333;
                margin: 20px;
            }

            h1 {
                color: #2c3e50;
                border-bottom: 2px solid #3498db;
                padding-bottom: 10px;
            }

            .tarjeta {
                background-color: #ffffff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                max-width: 750px;
            }

            input[type="button"] {
                padding: 10px 20px;
                background-color: #3498db;
                color: #ffffff;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 15px;
                margin-bottom: 15px;
            }

            input[type="button"]:hover {
                background-color: #2980b9;
            }

            table {
                border-collapse: collapse;
                width: 100%;
                margin-top: 15px;
            }

            th, td {
                border: 1px solid #dddddd;
                padding: 8px;
                text-align: center;
            }

            th {
                background-color: #2c3e50;
                color: white;
            }

            tr:nth-child(even) {
                background-color: #f9f9f9;
            }

            .resumen {
                margin-top: 20px;
                padding: 12px;
                background-color: #eef2f7;
                border-left: 4px solid #3498db;
                font-size: 14px;
                line-height: 1.5;
            }
        </style>

        <script src="Ejercicio14.js"></script>
    </head>
    <body>

        <h1>Ejercicios: Capítulo 10</h1>

        <div class="tarjeta">
            <h2>10.14 Simulación de Tiro de Dos Dados (36,000 Lanzamientos)</h2>
            
            <input id="botonSimular" type="button" value="Simular 36,000 Tiros">

            <div id="resultadoFrecuencias"></div>
            <div id="resumenSumas"></div>
        </div>

        <hr style="margin-top: 20px; border: none; border-top: 1px solid #ccc;">
        <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>

    </body>
</html>

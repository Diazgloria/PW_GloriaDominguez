<!DOCTYPE html>

<!-- Ejercicio 10.10 - Capítulo 10 -->
<!-- Programa para calcular comisiones de vendedores y resumir los salarios por rangos -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 10.10 - Rangos de Salarios</title>
        
        <style type="text/css">
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f9;
                color: #333333;
                margin: 20px;
            }

            h1 {
                color: #2c3e50;
                border-bottom: 2px solid #3498db;
                padding-bottom: 10px;
            }

            .tarjeta {
                background-color: #ffffff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                max-width: 600px;
            }

            form {
                margin-bottom: 20px;
            }

            label {
                font-weight: bold;
                display: block;
                margin-bottom: 8px;
            }

            input[type="number"] {
                padding: 8px;
                width: 200px;
                border: 1px solid #ccc;
                border-radius: 4px;
                margin-right: 10px;
            }

            input[type="button"] {
                padding: 8px 16px;
                background-color: #3498db;
                color: #ffffff;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            input[type="button"]:hover {
                background-color: #2980b9;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 15px;
            }

            th, td {
                border: 1px solid #dddddd;
                text-align: left;
                padding: 8px;
            }

            th {
                background-color: #2c3e50;
                color: white;
            }

            tr:nth-child(even) {
                background-color: #f2f2f2;
            }

            .detalle {
                margin-top: 10px;
                color: #27ae60;
                font-weight: bold;
            }
        </style>

        <script src="Ejercicio10.js"></script>
    </head>
    <body>

        <h1>Ejercicios: Capítulo 10</h1>

        <div class="tarjeta">
            <h2>10.10 Cálculo de Rangos de Salarios de Vendedores</h2>

            <form action="#">
                <label for="ventas">Ingrese las ventas brutas del vendedor ($):</label>
                <input id="ventas" type="number" min="0" placeholder="Ej. 5000">
                <input id="botonCalcular" type="button" value="Calcular y Registrar">
            </form>

            <div id="mensajeResultado" class="detalle"></div>

            <div id="resultadoTabla"></div>
        </div>

        <hr style="margin-top: 20px; border: none; border-top: 1px solid #ccc;">
        <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>

    </body>
</html>

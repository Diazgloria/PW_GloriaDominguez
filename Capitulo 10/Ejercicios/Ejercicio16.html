<!DOCTYPE html>

<!-- Ejercicio 10.16 - Capítulo 10 -->
<!-- La criba de Eratóstenes para encontrar números primos entre 1 y 999 -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 10.16 - La criba de Eratóstenes</title>
        
        <!-- Estilos CSS integrados -->
        <style type="text/css">
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f9;
                color: #333333;
                margin: 20px;
            }

            h1 {
                color: #2c3e50;
                border-bottom: 2px solid #3498db;
                padding-bottom: 10px;
            }

            .tarjeta {
                background-color: #ffffff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                max-width: 750px;
            }

            input[type="button"] {
                padding: 10px 18px;
                background-color: #3498db;
                color: #ffffff;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                margin-bottom: 15px;
            }

            input[type="button"]:hover {
                background-color: #2980b9;
            }

            .resumen {
                background-color: #eef2f7;
                padding: 12px;
                border-left: 4px solid #3498db;
                margin-bottom: 15px;
                font-size: 14px;
                font-weight: bold;
            }

            .contenedor-primos {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                max-height: 400px;
                overflow-y: auto;
                padding: 10px;
                border: 1px solid #e0e0e0;
                border-radius: 4px;
                background-color: #fafafa;
            }

            .item-primo {
                background-color: #2c3e50;
                color: #ffffff;
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 12px;
                font-family: monospace;
            }
        </style>

        <!-- Script de JavaScript independiente -->
        <script src="Ejercicio16.js"></script>
    </head>
    <body>

        <h1>Ejercicios: Capítulo 10</h1>

        <div class="tarjeta">
            <h2>10.16 La criba de Eratóstenes</h2>

            <input id="botonCalcular" type="button" value="Calcular Primos (1 a 999)">

            <div id="resumenPrimos" class="resumen">Haga clic en el botón para ejecutar la criba.</div>
            <div id="contenedorPrimos" class="contenedor-primos"></div>
        </div>

        <hr style="margin-top: 20px; border: none; border-top: 1px solid #ccc;">
        <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>

    </body>
</html>

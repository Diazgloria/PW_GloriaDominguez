<!DOCTYPE html>

<!-- Ejercicio 10.13 - Capítulo 10 -->
<!-- Programa para etiquetar y vaciar en orden la matriz de ventas -->
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 10.13 - Etiquetado de Arreglo Bidimensional</title>
        
        <style type="text/css">
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f6f9;
                color: #333333;
                margin: 20px;
            }

            h1 {
                color: #2c3e50;
                border-bottom: 2px solid #3498db;
                padding-bottom: 10px;
            }

            .tarjeta {
                background-color: #ffffff;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                max-width: 700px;
            }

            input[type="button"] {
                padding: 8px 16px;
                background-color: #3498db;
                color: #ffffff;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                margin-bottom: 15px;
            }

            input[type="button"]:hover {
                background-color: #2980b9;
            }

            table {
                border-collapse: collapse;
                width: 100%;
                margin-top: 10px;
            }

            th, td {
                border: 1px solid #dddddd;
                padding: 10px;
                text-align: center;
            }

            th {
                background-color: #2c3e50;
                color: white;
            }

            tr:nth-child(even) {
                background-color: #f9f9f9;
            }

            .detalle {
                margin-bottom: 10px;
                color: #555555;
                font-size: 14px;
            }
        </style>

        <script src="Ejercicio13.js"></script>
    </head>
    <body>

        <h1>Ejercicios: Capítulo 10</h1>

        <div class="tarjeta">
            <h2>10.13 Orden de Modificación en Matriz Bidimensional (3x5)</h2>
            <div class="detalle">
                Haga clic en el botón para ver la secuencia exacta en la que el bucle <code>for...in</code> asigna ceros a los elementos del arreglo <code>ventas</code>.
            </div>

            <input id="botonSimular" type="button" value="Simular Recorrido">

            <div id="tablaContenedor"></div>
        </div>

        <hr style="margin-top: 20px; border: none; border-top: 1px solid #ccc;">
        <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>

    </body>
</html>

<!DOCTYPE html>

<!-- Ejercicio 3.6 Formulario de registro Web con encuesta opcional -->
<html>
    <head>
        <meta charset="utf-8">
        <title>3.6 Formulario de Registro</title>
    </head>

    <body>
        <h1>Formulario de Registro de Usuario</h1>

        <form action="#" method="post">

            <!-- Datos personales obligatorios -->
            <p>
                <label for="nombre">Primer nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </p>

            <p>
                <label for="apellido">Apellido:</label><br>
                <input type="text" id="apellido" name="apellido" required>
            </p>

            <p>
                <label for="correo">Correo electrónico:</label><br>
                <input type="email" id="correo" name="correo" required>
            </p>

            <!-- Encuesta opcional dentro del elemento details -->
            <details>
                <summary>Pregunta opcional de la encuesta</summary>
                <p>
                    <label for="anio">¿En qué año de la universidad se encuentra?</label><br>
                    <select id="anio" name="anio_universidad">
                        <option value="">-- Seleccione un año --</option>
                        <option value="primer">Primer año</option>
                        <option value="segundo">Segundo año</option>
                        <option value="tercer">Tercer año</option>
                        <option value="cuarto">Cuarto año</option>
                        <option value="quinto">Quinto año o superior</option>
                    </select>
                </p>
            </details>

            <br>

            <!-- Botones de acción -->
            <p>
                <input type="submit" value="Registrarse">
                <input type="reset" value="Restablecer">
            </p>

        </form>

        <hr>
        <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>

    </body>
</html>

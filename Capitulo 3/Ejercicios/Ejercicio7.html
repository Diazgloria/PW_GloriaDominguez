<!DOCTYPE html>

<!-- Ejercicio 3.7 Formulario de búsqueda con autocomplete -->
<html>
    <head>
        <meta charset="utf-8">
        <title>3.7 Formulario de Búsqueda con Autocompletado</title>
    </head>

    <body>
        <h1>Formulario de Búsqueda</h1>

        <!-- Formulario con autocompletado habilitado por defecto -->
        <form action="#" method="get" autocomplete="on">
            <p>
                <label for="busqueda">Consulta de búsqueda:</label><br>
                <input type="search" id="busqueda" name="q" placeholder="Escriba su búsqueda..." required>
            </p>

            <p>
                <input type="submit" value="Buscar">
            </p>
        </form>

        <hr>
        <p><a href="lista_ejercicios.html">Regresar a la lista de ejercicios</a></p>

    </body>
</html>
